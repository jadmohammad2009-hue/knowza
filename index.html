<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة التوجيهي - تاريخ الأردن</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --success-bg: #dcfce7;
      --success-border: #22c55e;
      --success-text: #14532d;
      --danger-bg: #fee2e2;
      --danger-border: #ef4444;
      --danger-text: #7f1d1d;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .hidden { display: none !important; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .option-btn {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid #cbd5e1;
      padding: 12px;
      border-radius: 8px;
      text-align: right;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
      transition: all 0.2s;
    }

    .option-btn.selected {
      background: #e2e8f0;
      border-color: var(--primary);
      font-weight: bold;
    }

    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }

    /* كروت النتيجة النهائية - تصميم أحمر وأخضر كامل */
    .result-card {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 2px solid transparent;
    }

    .result-card.correct-box {
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .result-card.incorrect-box {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .result-score {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    .explanation-box {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
      border-top: 1px dashed rgba(0,0,0,0.15);
      padding-top: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- صفحة البداية واختيار عدد الأسئلة -->
  <div id="start-screen">
    <h2>اختبار تاريخ الأردن - الفصل الأول (العصور الحجرية)</h2>
    <p>اختر عدد الأسئلة للبدء:</p>
    <div class="btn-group">
      <button class="btn" onclick="startQuiz(10)">اختبار سريع (10 أسئلة)</button>
      <button class="btn" onclick="startQuiz('all')">امتحان كامل (110 سؤال)</button>
    </div>
  </div>

  <!-- صفحة تقديم الامتحان -->
  <div id="quiz-screen" class="hidden">
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
      <span id="question-count">سؤال 1</span>
    </div>
    <h3 id="question-text">نص السؤال...</h3>
    <div id="options-container"></div>
    <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي</button>
  </div>

  <!-- صفحة النتيجة النهائية -->
  <div id="result-screen" class="hidden">
    <h2>نتيجة الاختبار</h2>
    <div id="score-display" class="result-score">علامتك: 0 / 0</div>
    <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 20px 0;">
    <h3>مراجعة الإجابات:</h3>
    <div id="answers-summary"></div>
    <button class="btn" onclick="location.reload()">إعادة الاختبار</button>
  </div>

</div>

<script>
  let allQuestions = [];
  let selectedQuestions = [];
  let currentIndex = 0;
  let userAnswers = [];

  async function loadQuestions() {
    try {
      const response = await fetch('questions.json');
      allQuestions = await response.json();
    } catch (e) {
      alert('حدث خطأ في تحميل ملف الأسئلة questions.json');
    }
  }

  loadQuestions();

  function startQuiz(countOption) {
    if (allQuestions.length === 0) {
      alert('جاري تحميل الأسئلة، يرجى الانتظار ثوانٍ ثم المحاولة مجدداً.');
      return;
    }

    if (countOption === 'all') {
      selectedQuestions = [...allQuestions];
    } else {
      // اختيار 10 أسئلة عشوائية
      selectedQuestions = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, countOption);
    }

    currentIndex = 0;
    userAnswers = [];

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    showQuestion();
  }

  function showQuestion() {
    const q = selectedQuestions[currentIndex];
    document.getElementById('question-count').innerText = `السؤال ${currentIndex + 1} من ${selectedQuestions.length}`;
    document.getElementById('question-text').innerText = q.q;

    const progressPct = ((currentIndex + 1) / selectedQuestions.length) * 100;
    document.getElementById('progress-fill').style.width = `${progressPct}%`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      container.appendChild(btn);
    });

    document.getElementById('next-btn').classList.add('hidden');
  }

  function selectOption(idx) {
    userAnswers[currentIndex] = idx;
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach((btn, i) => {
      btn.classList.toggle('selected', i === idx);
    });
    document.getElementById('next-btn').classList.remove('hidden');
  }

  function nextQuestion() {
    if (userAnswers[currentIndex] === undefined) return;

    currentIndex++;
    if (currentIndex < selectedQuestions.length) {
      showQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    let correctCount = 0;
    const summaryContainer = document.getElementById('answers-summary');
    summaryContainer.innerHTML = '';

    selectedQuestions.forEach((q, index) => {
      const userChoice = userAnswers[index];
      const isCorrect = userChoice === q.correct;
      if (isCorrect) correctCount++;

      const card = document.createElement('div');
      // تحويل البوكس كاملاً إلى أخضر إذا صح، أو أحمر إذا خطأ
      card.className = `result-card ${isCorrect ? 'correct-box' : 'incorrect-box'}`;

      card.innerHTML = `
        <strong>سؤال ${index + 1}: ${q.q}</strong><br>
        <div style="margin-top: 6px;">إجابتك: ${q.options[userChoice] !== undefined ? q.options[userChoice] : 'لم يتم الإجابة'}</div>
        ${!isCorrect ? `<div>الإجابة الصحيحة: ${q.options[q.correct]}</div>` : ''}
        ${q.explanation ? `<div class="explanation-box">التوضيح: ${q.explanation}</div>` : ''}
      `;
      summaryContainer.appendChild(card);
    });

    // عرض النتيجة بدون إيموجيات وبصيغة: علامتك: X / Y
    document.getElementById('score-display').innerText = `علامتك: ${correctCount} / ${selectedQuestions.length}`;
  }
</script>

</body>
</html>
